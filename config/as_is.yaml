# As-Is: 원본 기획서 제약 (엄격판)
name: as_is
portfolio: {sets: 30, seed: 0, workers: 4}
data: {window: 100, source: auto}
weighting:
  recent_window: 10
  recent_weight: 1.5
  base_weight: 1.0
  groups: {hot: 14, warm: 17, cold: 14}
  hot_top: 5
targets:
  odd_even: {"4:2": 0.36, "3:3": 0.33, "2:4": 0.24, other: 0.07}
  low_high: {"3:3": 0.35, "4:2": 0.35, "2:4": 0.25, other: 0.05}
  carry: null
  group_mix: null
  sum_bins: null
rules:
  carry_over: {per_set: [1, 1], per_number_uses: [4, 6]}
  group_mix:
    hot: [3, 3]
    warm: [1, 2]
    cold: [1, 2]
    combos: [[3, 2, 1], [3, 1, 2]]
  mean_reversion: {mode: weight, candidates: 5, bonus: 0.2}
  sum_range: [100, 175]
  consecutive: {max_run: 2, max_pairs: 1, zero_pair_share: [0.45, 0.55]}
  ac_min: 7
  zones: {min_zones: 3, max_per_zone: 3}
  odd_count: [1, 5]
  low_count: [1, 5]
  bands: {}
  overlap: {max_common: 3}
  appearance: {general: [2, 8], hot_top: [3, 10]}
  coverage: {total: 40, hot: 13, warm: 15, cold: 12}
relax:
  - {"rules.overlap.max_common": 4}
objective:
  - {name: distribution_error, time_limit: 60}
  - {name: overlap, time_limit: 60}
  - {name: appearance_spread, time_limit: 60}
