# As-Is: 원본 기획서 제약 (엄격판)
name: as_is
portfolio: {sets: 30, seed: null, workers: 4}
data: {window: 100, source: auto}
weighting:
  recent_window: 10
  recent_weight: 1.5
  base_weight: 1.0
  groups: {hot: 14, warm: 17, cold: 14}
  hot_top: 5
targets:
  odd_even: spec
  low_high: spec
  carry: null
  group_mix: null
  sum_bins: null
rules:
  carry_over: {per_set: [1, 1]}
  group_mix:
    hot: [3, 3]
    warm: [1, 2]
    cold: [1, 2]
    combos: [[3, 2, 1], [3, 1, 2]]
  mean_reversion: {mode: weight, candidates: 5, bonus: 0.2}
  sum_range: [100, 175]
  consecutive: {max_run: 2, max_pairs: 1, zero_pair_share: [0.45, 0.55]}
  ac_min: 7
  zones: {min_zones: 3, max_per_zone: 3}
  odd_count: [1, 5]
  low_count: [1, 5]
  bands: {}
  overlap: {max_common: 3}
profiles:
  30:
    rules.appearance: {general: [2, 8], hot_top: [3, 10]}
    rules.carry_over.per_number_uses: [4, 6]
    rules.coverage: {total: 40, hot: 13, warm: 15, cold: 12}
  50:
    rules.appearance: {general: [3, 12], hot_top: [4, 15]}
    rules.carry_over.per_number_uses: [7, 10]
    rules.coverage: {total: 43, hot: 13, warm: 16, cold: 13}
relax:
  - {"rules.overlap.max_common": 4}
objective:
  - {name: distribution_error, rounds: 30, patience: 6}
  - {name: overlap, rounds: 12, patience: 4}
  - {name: appearance_variance, rounds: 15, patience: 4}
