# To-Be: 사용자 개선안 (완화 제약 + 목표 분포 페널티)
name: to_be
portfolio:
  sets: 30
  seed: 0
  workers: 4

data:
  window: 100            # 분석 회차 수
  source: auto           # auto(공식 → 미러) | official | mirror | cache

weighting:
  recent_window: 10
  recent_weight: 1.5
  base_weight: 1.0
  groups: {hot: 14, warm: 17, cold: 14}
  hot_top: 5

# 목표 분포: auto 이면 최근 window 회차에서 산출, 아니면 아래 값 사용
targets:
  odd_even: auto         # 버킷: "4:2","3:3","2:4",other
  low_high: auto         # 버킷: "3:3","4:2","2:4",other (저=1~22)
  carry: auto            # 이월수 개수 0/1/2 분포
  group_mix: auto        # 그룹별 세트당 개수 분포 (현재 그룹 기준 과거 회차 구성)
  sum_bins: auto         # 과거 합계 5분위 구간에 고르게

rules:
  carry_over:
    per_set: [0, 2]
    per_number_uses: [4, 6]
  group_mix:
    hot: [2, 4]
    warm: [1, 3]
    cold: [1, 2]
    combos: null         # [[h,w,c], ...] 지정 시 그 조합만 허용
  mean_reversion:
    mode: forced         # forced | weight | off
    candidates: 5        # Cold 중 최장 미출현 N개
    min_numbers: 2       # 그중 최소 몇 개를
    min_sets_each: 5     # 각각 몇 세트 이상 포함
    bonus: 0.2           # mode=weight 일 때만 사용
  sum_range: [100, 175]
  consecutive: {max_run: 2, max_pairs: 1, zero_pair_share: [0.45, 0.55]}
  ac_min: 7
  zones: {min_zones: 3, max_per_zone: 3}
  odd_count: [1, 5]      # 세트당 홀수 개수 허용 범위
  low_count: [1, 5]
  bands:                 # 전역 분포 허용 범위(세트 비율). 목표와 별개인 하드 한계
    odd_even: {"4:2": [0.30, 0.40]}
  overlap: {max_common: 3}
  appearance: {general: [2, 8], hot_top: [3, 10]}
  coverage: {total: 40, hot: 13, warm: 15, cold: 12}

# 해가 없을 때 순서대로 적용할 완화 (점 경로: 값)
relax:
  - {"rules.overlap.max_common": 4}

objective:               # 위에서부터 사전식 최적화
  - {name: distribution_error, time_limit: 60}
  - {name: overlap, time_limit: 60}
  - {name: appearance_spread, time_limit: 60}
